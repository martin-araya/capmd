# git-cliff config for capmd
# https://git-cliff.org/docs/configuration
#
# Run `git-cliff` to regenerate CHANGELOG.md.
# Run `git-cliff --bump` to compute the next SemVer from conventional commits.

[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),\nand this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
body = """
{% if version -%}
## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [unreleased]
{% endif -%}
{% for group, commits in commits | filter(attribute="merge_commit", value=false) | group_by(attribute="group") -%}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits | sort(attribute="message") -%}
- {% if commit.breaking %}[**breaking**] {% endif -%}
  {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
  {% if commit.authors %} ([{{ commit.authors | map(attribute="name") | join(", ") | replace(from="\\", to="") }}]){% endif -%}
{%- endfor %}
{% endfor %}
"""
footer = """
<!-- generated by git-cliff + capmd {{ version }} -->
"""
trim = true
postprocessors = [
  { pattern = "\\s+(?=<)", replace = "" },
]

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
topo_order = false
sort_commits = "newest_first"

[changelog.git]
take_new = 100
url = "https://github.com/martin-araya/capmd"

[bump]
features_always_bump_minor = false
breaking_always_bump_major = true

# Commit parsers: patrones de conventional commits que git-cliff reconoce.
[[commit_parsers]]
# Major bump on BREAKING CHANGE / feat! / fix! / chore! etc.
pattern = "^[Mm]erge"
group = ""

[[commit_parsers]]
pattern = "^([Ff]eat|[Ff]ix|[Dd]ocs|[Ss]tyle|[Rr]efactor|[Pp]erf|[Tt]est|[Bb]uild|[Cc]i|[Cc]hore|[Rr]evert)(?:\\(.+\\))?!:"
group = "{{ capture(1) | lower }}"

[[commit_parsers]]
pattern = "^([Ff]eat|[Ff]ix|[Dd]ocs|[Ss]tyle|[Rr]efactor|[Pp]erf|[Tt]est|[Bb]uild|[Cc]i|[Cc]hore|[Rr]evert)(?:\\(.+\\))?:"
group = "{{ capture(1) | lower }}"

[commit_groups]
feat = { title = "Features", body = "New functionality shipped." }
fix = { title = "Bug Fixes", body = "Bugs and regressions resolved." }
perf = { title = "Performance", body = "Performance improvements." }
refactor = { title = "Refactoring", body = "Internal cleanup with no behaviour change." }
docs = { title = "Documentation", body = "Doc-only changes." }
test = { title = "Tests", body = "Test additions or fixes." }
build = { title = "Build System", body = "Packaging, deps, or build tooling changes." }
ci = { title = "CI / Hooks", body = "Continuous integration and git hooks." }
style = { title = "Style", body = "Format-only changes with no logic effect." }
chore = { title = "Chores", body = "Maintenance tasks." }
revert = { title = "Reverts", body = "Reverted commits." }
